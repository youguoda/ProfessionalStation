# /etc/nginx/conf.d/pstation.conf
#
# 这个应用没有任何身份校验（src/ 里搜 auth/session/cookie 是零结果）。
# 这一层就是它唯一的门。别把 3000 直接开到内网。
#
#   sudo htpasswd -c /etc/nginx/.htpasswd guoda

server {
    listen 80;
    server_name task.corp.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name task.corp.local;

    # 内网自签就够。上 HTTPS 不只为安全：
    # 浏览器 Notification API 需要安全上下文，走 http:// 的话到期提醒会静默失效
    ssl_certificate     /etc/nginx/certs/task.crt;
    ssl_certificate_key /etc/nginx/certs/task.key;

    auth_basic           "ProfessionalStation";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 导入数据 / 长任务描述
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 空 Connection = 复用到上游的长连接（不是 websocket 的 Upgrade 那套）
        proxy_set_header Connection        "";
    }

    # 马力的流式回复走 SSE。Nginx 默认缓冲会把打字机变成
    # 「转圈半天，然后整段蹦出来」——这里必须关掉。
    # 应用侧也回了 X-Accel-Buffering: no，两头都堵上。
    location /api/agent/chat {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";

        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }
}
